name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  PYINSTALLER_ARGS: >-
    --noconfirm --windowed --name mgt-map-gen --paths . --icon assets/icon.png
    --add-data "mgt_map_gen_py/ui/icons:mgt_map_gen_py/ui/icons"

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pyinstaller pillow
      # Windows wants ';' as the --add-data separator.
      - run: pyinstaller --onefile --noconfirm --windowed --name mgt-map-gen --paths . --icon assets/icon.png --add-data "mgt_map_gen_py/ui/icons;mgt_map_gen_py/ui/icons" packaging/launcher.py
      - run: mv dist/mgt-map-gen.exe MGT-Map-Generator-windows-x64.exe
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: MGT-Map-Generator-windows-x64.exe

  linux:
    runs-on: ubuntu-22.04  # oldest glibc we can get, so the AppImage runs on most distros
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # Qt's xcb/GL libraries: installed so PyInstaller bundles them into the AppImage.
      - run: >
          sudo apt-get update && sudo apt-get install -y
          libgl1 libegl1 libglib2.0-0 libfontconfig1 libdbus-1-3 libxkbcommon-x11-0
          libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0
          libxcb-render-util0 libxcb-shape0 libxcb-xinerama0
      - run: pip install -r requirements.txt pyinstaller pillow
      - run: pyinstaller $PYINSTALLER_ARGS packaging/launcher.py
      - name: Smoke test (must still be running after 15 s)
        run: |
          set +e
          QT_QPA_PLATFORM=offscreen timeout 15 dist/mgt-map-gen/mgt-map-gen
          [ $? -eq 124 ]
      - run: packaging/build_appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: MGT-Map-Generator-x86_64.AppImage

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            MGT-Map-Generator-windows-x64.exe
            MGT-Map-Generator-x86_64.AppImage
